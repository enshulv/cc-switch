packages: []

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

ignoredBuiltDependencies:
  - msw

# Fork-only: minimum versions that clear known security advisories. Kept here
# rather than in package.json because upstream rarely touches this file, so the
# fork's auto-rebase does not conflict on it; overrides also apply to direct
# dependencies, so package.json ranges may read older than what is installed.
# Drop an entry once upstream's own range already resolves past it.
overrides:
  vitest: ^4.1.12
  vite: ^7.3.7
  postcss: ^8.5.18
  zod: ^4.6.6
  smol-toml: ^1.9.1
  rollup: ^4.59.0
  browserslist: ^4.28.7
  form-data: ^4.0.6
  nanoid@<4: ^3.3.18
  picomatch@<3: ^2.3.2
  picomatch@>=4: ^4.0.4
  source-map-js: ^1.2.2
  ws: ^8.21.0
  '@babel/core': ^7.29.6
  postcss-selector-parser@<7: ^6.1.5
  yaml@>=2: ^2.8.3
